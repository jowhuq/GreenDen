<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Grid Layout Page</title>
  <style>
    /* reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      background: #cceeff;
      min-height: 100vh;
    }

    /* 1) overall grid container */
    .container {
      display: grid;
      grid-template-areas:
        "header header"
        "aside   article"
        "footer  footer";
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
      height: 100vh;
    }

    header {
      grid-area: header;
      background: #00baba;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
    }

    aside {
      grid-area: aside;
      background: #66dd66;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      
    }
    #ta{
        margin-top: 300px;
    }

    /* 2) article area as its own flex‑column */
    article {
      grid-area: article;
      background: #ffaa44;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;       /* center children horizontally */
      gap: 30px;                 /* space between heading & images row */
    }

    article > h2 {
      font-size: 2em;
      margin-top: 300px;
    }

    /* 3) row of images inside article */
    .images-row {
        margin-top: 50px;
      display: flex;
      justify-content: center;   /* center the row of boxes */
      gap: 20px;                 /* space between boxes */
      width: 100%;
    }

    .image-box {
      background: #ffcc44;
      color: white;
      width: 150px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 4px;
      margin-right: 50px;
    }

    footer {
      grid-area: footer;
      background: #007777;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.3em;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>Header</header>

    <aside><div id="ta">Aside</div>
        </aside>

    <article>
      <h2>Article</h2>
      <div class="images-row">
        <div class="image-box">Image</div>
        <div class="image-box">Image</div>
        <div class="image-box">Image</div>
      </div>
    </article>

    <footer>Footer</footer>
  </div>

</body>
</html>
